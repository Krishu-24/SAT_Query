<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatQuery AI — Agentic Remote Sensing Analysis</title>
    <meta name="description" content="Upload satellite images, ask questions, and get AI-powered analysis with evidence and execution traces.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d27;
            --bg-card: #1e2130;
            --bg-input: #252838;
            --border: #2d3148;
            --border-focus: #6366f1;
            --text-primary: #e8eaf0;
            --text-secondary: #9ca3b0;
            --text-muted: #6b7280;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --radius: 10px;
            --radius-lg: 14px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left { display: flex; align-items: center; gap: 0.75rem; }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
            border-radius: 999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Layout ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
        }

        /* ── Cards ── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
        }
        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ── Upload ── */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .upload-zone:hover, .upload-zone.drag-over {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }
        .upload-zone input { display: none; }
        .upload-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .upload-text { color: var(--text-secondary); font-size: 0.85rem; }
        .upload-text strong { color: var(--accent); }

        .preview-grid {
            display: flex; gap: 0.75rem; margin-top: 0.75rem; flex-wrap: wrap;
        }
        .preview-item {
            position: relative;
            width: 80px; height: 80px;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .preview-item img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .preview-remove {
            position: absolute; top: 2px; right: 2px;
            width: 20px; height: 20px;
            background: rgba(239,68,68,0.9);
            border: none; border-radius: 50%;
            color: #fff; font-size: 12px;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }

        /* ── Modality Selector ── */
        .modality-row {
            display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap;
        }
        .mod-tag {
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }
        .mod-tag.active {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
        }

        /* ── Query Input ── */
        .query-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 70px;
            transition: border-color 0.2s;
        }
        .query-input:focus {
            outline: none;
            border-color: var(--border-focus);
        }
        .query-input::placeholder { color: var(--text-muted); }

        .example-queries {
            display: flex; gap: 0.4rem; margin-top: 0.75rem; flex-wrap: wrap;
        }
        .example-btn {
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
            font-size: 0.7rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }
        .example-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Submit ── */
        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            border: none;
            border-radius: var(--radius);
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.5; cursor: not-allowed;
        }
        .submit-btn.loading { pointer-events: none; }
        .submit-btn.loading::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ── Results ── */
        .result-section { grid-column: 1 / -1; }

        .answer-box {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 3px solid var(--accent);
        }
        .answer-text { font-size: 0.95rem; line-height: 1.7; }

        .confidence-bar {
            display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem;
        }
        .conf-track {
            flex: 1; height: 6px;
            background: var(--bg-input);
            border-radius: 999px;
            overflow: hidden;
        }
        .conf-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.8s ease;
        }
        .conf-label {
            font-size: 0.8rem; font-weight: 600; min-width: 45px; text-align: right;
        }

        /* ── Evidence ── */
        .evidence-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem; margin-top: 0.75rem;
        }
        .evidence-item {
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .evidence-item img {
            width: 100%; display: block;
        }
        .evidence-caption {
            padding: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* ── Trace ── */
        .trace-steps { margin-top: 0.75rem; }
        .trace-step {
            display: flex; align-items: flex-start; gap: 0.75rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(45, 49, 72, 0.5);
        }
        .trace-step:last-child { border-bottom: none; }
        .step-num {
            min-width: 28px; height: 28px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700;
        }
        .step-info { flex: 1; }
        .step-model {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .step-action {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .step-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .step-status {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
        }
        .step-status.success {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }
        .step-status.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .trace-meta {
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            font-size: 0.8rem;
        }
        .trace-meta-row {
            display: flex; justify-content: space-between;
            padding: 0.2rem 0;
        }
        .trace-meta-label { color: var(--text-muted); }
        .trace-meta-value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
        }

        /* ── Error ── */
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            color: var(--error);
            font-size: 0.85rem;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="header-left">
        <span style="font-size: 1.4rem;">🛰️</span>
        <h1>SatQuery AI</h1>
        <span class="badge">POC v0.1</span>
    </div>
    <div style="display:flex;align-items:center;gap:0.5rem;">
        <div class="status-dot" id="statusDot"></div>
        <span style="font-size:0.75rem;color:var(--text-muted);" id="statusText">Connecting…</span>
    </div>
</header>

<div class="container">

    <!-- Left: Input -->
    <div>
        <!-- Upload -->
        <div class="card">
            <div class="card-title">📷 Satellite Images</div>
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept=".tif,.tiff,.geotiff,.png,.jpg,.jpeg" multiple>
                <div class="upload-icon">🌍</div>
                <div class="upload-text"><strong>Click or drag</strong> to upload images (1-2)</div>
            </div>
            <div class="preview-grid" id="previewGrid"></div>

            <div class="card-title" style="margin-top:1rem;">🔬 Modality</div>
            <div class="modality-row" id="modalityRow"></div>
        </div>

        <!-- Query -->
        <div class="card" style="margin-top:1rem;">
            <div class="card-title">💬 Your Question</div>
            <textarea class="query-input" id="queryInput" placeholder="e.g., What objects are present in this image?"></textarea>
            <div class="example-queries" id="exampleQueries"></div>
            <button class="submit-btn" id="submitBtn" disabled>Analyze</button>
        </div>
    </div>

    <!-- Right: Results (initial) -->
    <div id="resultPanel">
        <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center;">
            <div style="font-size:3rem;margin-bottom:1rem;opacity:0.4;">🛰️</div>
            <div style="color:var(--text-muted);font-size:0.9rem;">Upload image(s) and ask a question</div>
            <div style="color:var(--text-muted);font-size:0.75rem;margin-top:0.5rem;">The agent will automatically detect the task type and select the right models</div>
        </div>
    </div>

    <!-- Full-width results (shown after analysis) -->
    <div id="resultsContainer" class="result-section hidden">
        <!-- Error -->
        <div id="errorBox" class="error-box hidden"></div>

        <!-- Answer -->
        <div class="card" id="answerCard" class="hidden">
            <div class="card-title">📝 Answer</div>
            <div class="answer-box">
                <div class="answer-text" id="answerText"></div>
                <div class="confidence-bar">
                    <span style="font-size:0.75rem;color:var(--text-muted);">Confidence</span>
                    <div class="conf-track"><div class="conf-fill" id="confFill"></div></div>
                    <span class="conf-label" id="confLabel"></span>
                </div>
            </div>
        </div>

        <!-- Evidence -->
        <div class="card" id="evidenceCard" style="margin-top:1rem;">
            <div class="card-title">🔍 Evidence</div>
            <div class="evidence-grid" id="evidenceGrid"></div>
            <div id="regionsInfo" style="margin-top:0.75rem;font-size:0.8rem;color:var(--text-secondary);"></div>
        </div>

        <!-- Trace -->
        <div class="card" id="traceCard" style="margin-top:1rem;">
            <div class="card-title">📊 Execution Trace</div>
            <div class="trace-meta" id="traceMeta"></div>
            <div class="trace-steps" id="traceSteps"></div>
        </div>
    </div>
</div>

<script>
const API_URL = 'http://localhost:8000';

// ── State ──
let uploadedFiles = [];
let modalities = [];

// ── Elements ──
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const previewGrid = document.getElementById('previewGrid');
const modalityRow = document.getElementById('modalityRow');
const queryInput = document.getElementById('queryInput');
const submitBtn = document.getElementById('submitBtn');
const resultPanel = document.getElementById('resultPanel');
const resultsContainer = document.getElementById('resultsContainer');
const errorBox = document.getElementById('errorBox');

// ── Example queries ──
const examples = [
    { text: 'What objects are present?', type: 'vqa' },
    { text: 'Describe this scene', type: 'caption' },
    { text: 'Highlight the water body', type: 'grounding' },
    { text: 'What changed between these dates?', type: 'change' },
    { text: 'Has the built-up area increased?', type: 'change_vqa' },
    { text: 'Identify regions using both images', type: 'optical_sar' },
];

const exampleContainer = document.getElementById('exampleQueries');
examples.forEach(ex => {
    const btn = document.createElement('button');
    btn.className = 'example-btn';
    btn.textContent = ex.text;
    btn.onclick = () => { queryInput.value = ex.text; updateSubmitState(); };
    exampleContainer.appendChild(btn);
});

// ── Upload ──
uploadZone.onclick = () => fileInput.click();
fileInput.onchange = (e) => addFiles(e.target.files);

uploadZone.ondragover = (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); };
uploadZone.ondragleave = () => uploadZone.classList.remove('drag-over');
uploadZone.ondrop = (e) => { e.preventDefault(); uploadZone.classList.remove('drag-over'); addFiles(e.dataTransfer.files); };

function addFiles(files) {
    for (const f of files) {
        if (uploadedFiles.length >= 2) break;
        uploadedFiles.push(f);
        modalities.push('optical');
    }
    renderPreviews();
    updateSubmitState();
}

function removeFile(idx) {
    uploadedFiles.splice(idx, 1);
    modalities.splice(idx, 1);
    renderPreviews();
    updateSubmitState();
}

function renderPreviews() {
    previewGrid.innerHTML = '';
    uploadedFiles.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'preview-item';
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        const btn = document.createElement('button');
        btn.className = 'preview-remove';
        btn.innerHTML = '×';
        btn.onclick = (e) => { e.stopPropagation(); removeFile(i); };
        div.appendChild(img);
        div.appendChild(btn);
        previewGrid.appendChild(div);
    });
    renderModalities();
}

function renderModalities() {
    modalityRow.innerHTML = '';
    uploadedFiles.forEach((f, i) => {
        const label = document.createElement('span');
        label.style.fontSize = '0.75rem';
        label.style.color = 'var(--text-muted)';
        label.style.marginRight = '0.25rem';
        label.textContent = `Image ${i + 1}:`;
        modalityRow.appendChild(label);

        ['optical', 'sar'].forEach(mod => {
            const tag = document.createElement('button');
            tag.className = 'mod-tag' + (modalities[i] === mod ? ' active' : '');
            tag.textContent = mod.toUpperCase();
            tag.onclick = () => { modalities[i] = mod; renderModalities(); };
            modalityRow.appendChild(tag);
        });

        if (i < uploadedFiles.length - 1) {
            const spacer = document.createElement('div');
            spacer.style.width = '100%';
            modalityRow.appendChild(spacer);
        }
    });
}

// ── Submit ──
queryInput.oninput = updateSubmitState;

function updateSubmitState() {
    submitBtn.disabled = uploadedFiles.length === 0 || !queryInput.value.trim();
}

submitBtn.onclick = analyze;

async function analyze() {
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');
    submitBtn.textContent = 'Analyzing…';
    resultsContainer.classList.add('hidden');
    errorBox.classList.add('hidden');

    const formData = new FormData();
    uploadedFiles.forEach(f => formData.append('images', f));
    formData.append('query', queryInput.value);
    formData.append('modalities', modalities.join(','));

    try {
        const res = await fetch(`${API_URL}/api/analyze`, { method: 'POST', body: formData });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail?.errors?.join(', ') || `HTTP ${res.status}`);
        }

        const data = await res.json();
        renderResults(data);
    } catch (e) {
        errorBox.textContent = `Error: ${e.message}`;
        errorBox.classList.remove('hidden');
        resultsContainer.classList.remove('hidden');
    } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        submitBtn.textContent = 'Analyze';
        updateSubmitState();
    }
}

// ── Render Results ──
function renderResults(data) {
    resultPanel.classList.add('hidden');
    resultsContainer.classList.remove('hidden');

    // Answer
    document.getElementById('answerText').textContent = data.answer;

    // Confidence
    const conf = data.confidence;
    const confPct = Math.round(conf * 100);
    const fill = document.getElementById('confFill');
    fill.style.width = confPct + '%';
    fill.style.background = conf > 0.8 ? 'var(--success)' : conf > 0.6 ? 'var(--warning)' : 'var(--error)';
    document.getElementById('confLabel').textContent = confPct + '%';

    // Evidence images
    const evidenceGrid = document.getElementById('evidenceGrid');
    evidenceGrid.innerHTML = '';
    if (data.evidence?.images?.length) {
        data.evidence.images.forEach(img => {
            const div = document.createElement('div');
            div.className = 'evidence-item';
            const imgEl = document.createElement('img');
            imgEl.src = API_URL + img.url;
            imgEl.alt = img.caption;
            imgEl.onerror = () => { imgEl.style.display = 'none'; };
            const cap = document.createElement('div');
            cap.className = 'evidence-caption';
            cap.textContent = img.caption;
            div.appendChild(imgEl);
            div.appendChild(cap);
            evidenceGrid.appendChild(div);
        });
    } else {
        evidenceGrid.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;">No evidence images for this task type</div>';
    }

    // Regions
    const regionsInfo = document.getElementById('regionsInfo');
    if (data.evidence?.regions?.length) {
        regionsInfo.innerHTML = `<strong>${data.evidence.regions.length} region(s)</strong> detected: ` +
            data.evidence.regions.map(r => `${r.label} (${Math.round(r.confidence * 100)}%)`).join(', ');
    } else {
        regionsInfo.innerHTML = '';
    }

    // Trace
    const trace = data.execution_trace;
    const traceMeta = document.getElementById('traceMeta');
    traceMeta.innerHTML = `
        <div class="trace-meta-row">
            <span class="trace-meta-label">Detected Task</span>
            <span class="trace-meta-value">${trace.detected_task}</span>
        </div>
        <div class="trace-meta-row">
            <span class="trace-meta-label">Confidence</span>
            <span class="trace-meta-value">${Math.round(trace.task_confidence * 100)}%</span>
        </div>
        <div class="trace-meta-row">
            <span class="trace-meta-label">Reasoning</span>
            <span class="trace-meta-value">${trace.reasoning}</span>
        </div>
        <div class="trace-meta-row">
            <span class="trace-meta-label">Images</span>
            <span class="trace-meta-value">${trace.input_validation.image_count} (${trace.input_validation.modality.join(', ')})</span>
        </div>
        <div class="trace-meta-row">
            <span class="trace-meta-label">Total Time</span>
            <span class="trace-meta-value">${trace.total_time_ms.toFixed(0)} ms</span>
        </div>
    `;

    const traceSteps = document.getElementById('traceSteps');
    traceSteps.innerHTML = '';
    trace.pipeline_steps.forEach(step => {
        const div = document.createElement('div');
        div.className = 'trace-step';
        div.innerHTML = `
            <div class="step-num">${step.step}</div>
            <div class="step-info">
                <div class="step-model">${step.model}</div>
                <div class="step-action">${step.action}</div>
            </div>
            <span class="step-status ${step.status}">${step.status}</span>
            <span class="step-time">${step.time_ms.toFixed(0)}ms</span>
        `;
        traceSteps.appendChild(div);
    });
}

// ── Health check ──
async function checkHealth() {
    try {
        const res = await fetch(`${API_URL}/api/health`);
        const data = await res.json();
        document.getElementById('statusDot').style.background = 'var(--success)';
        document.getElementById('statusText').textContent = `${data.registered_models?.length || 0} models registered`;
    } catch {
        document.getElementById('statusDot').style.background = 'var(--error)';
        document.getElementById('statusText').textContent = 'Backend offline';
    }
}
checkHealth();
setInterval(checkHealth, 15000);
</script>
</body>
</html>
